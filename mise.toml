[tools]
# tools/gen-icons.py (mise run icons)
python = "3.15"

[tasks.test]
description = "Unit tests for the pure modules, under the plain steel CLI"
dir = "tests"
run = 'for t in *-test.scm; do echo "== $t"; steel "$t" || exit 1; done'

[tasks.install]
description = "Install this checkout as the ideish cog and build libideish"
run = "forge install --force"

[tasks.icons]
description = "Regenerate icons/catalog.scm from nvim-web-devicons"
run = "python3 tools/gen-icons.py"

[tasks.smoke]
description = "Start Helix with dev/init.scm in tmux and check that ideish draws"
run = "./dev/test.sh"
