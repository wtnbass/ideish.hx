[package]
name = "ideish"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native side of ideish.hx: filesystem events and git status for Steel-enabled Helix"

[lib]
name = "ideish"
crate-type = ["cdylib"]

[dependencies]
# Same steel revision as the Steel-enabled Helix build, so the FFI layout matches
steel-core = { git = "https://github.com/mattwparas/steel.git", rev = "24cd21598c091fb88bc10a6375a1ded25e677c37", features = ["dylibs", "sync"] }
abi_stable = "0.11.1"
notify = "8"
notify-debouncer-full = "0.6"
ignore = "0.4"

# The terminal pane, built only with RUSTFLAGS="--cfg ideish_terminal": forge
# cannot pass cargo features, and libghostty-vt needs Zig to build (see mise.toml).
# A git revision: 0.2.2 pins a Ghostty that needs Zig 0.15, which cannot link on macOS 26
[target.'cfg(ideish_terminal)'.dependencies]
libghostty-vt = { git = "https://github.com/uzaaft/libghostty-rs", rev = "0ef80413de1326685743378efbfa06d849e041a7" }
portable-pty = "0.9"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ideish_terminal)'] }
